worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 网关不解析业务内容，只做 TLS 终止、限速与转发
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # 上传上限与 portal 的 KB_UPLOAD_MAX_BYTES 保持一致（100 MiB）
    client_max_body_size 100m;
    client_body_timeout 120s;

    log_format p1 '$remote_addr - $request_id "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time upstream=$upstream_addr';
    access_log /dev/stdout p1;
    error_log  /dev/stderr warn;

    # 简单的连接/请求限速放在网关，避免应用被打穿
    limit_req_zone $binary_remote_addr zone=p1_api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=p1_conn:10m;

    upstream p1_api {
        server portal-api:18181;
        keepalive 32;
    }

    # HTTP 只做跳转，不承载任何业务
    server {
        listen 8080;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            # TLS 监听在 8443；8080 只做跳转，不能用 $server_port
            return 308 https://$host:8443$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:p1_tls:10m;
        ssl_session_timeout 1h;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;

        limit_conn p1_conn 64;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-Id      $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # 流式问答：SSE 必须关缓冲，否则 token 会被攒到结束才吐
        location /api/v1/chat/stream {
            limit_req zone=p1_api burst=10 nodelay;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_set_header Connection "";
            add_header X-Accel-Buffering no;
            proxy_pass http://p1_api;
        }

        # 上传/解析是长请求
        location /api/v1/documents {
            limit_req zone=p1_api burst=20 nodelay;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_pass http://p1_api;
        }

        location / {
            limit_req zone=p1_api burst=40 nodelay;
            proxy_read_timeout 120s;
            proxy_pass http://p1_api;
        }
    }
}
